<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beyblade X — Parts Index</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0B0D12;
    --surface:#12161F;
    --surface-2:#1A1F2B;
    --line:#262D3A;
    --line-2:#333c4d;
    --text:#E6EAF2;
    --muted:#8A93A6;
    --accent:#2DE0D0;      /* kinetic teal */
    --accent-dim:#1b8f86;
    --atk:#FF5257;         /* Attack */
    --def:#3DA5FF;         /* Defense */
    --sta:#39D98A;         /* Stamina */
    --bal:#B98BFF;         /* Balance */
    --display:'Chakra Petch','Rajdhani',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--accent)}

  /* ---------- Header ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(180deg,rgba(45,224,208,0.06),transparent 60%),
      var(--surface);
    padding:16px 18px 0;
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{
    font-family:var(--display);
    font-weight:700;
    font-size:22px;
    letter-spacing:.06em;
    margin:0;text-transform:uppercase;
  }
  .brand h1 .x{
    color:var(--accent);
    position:relative;
    text-shadow:0 0 14px rgba(45,224,208,.55);
  }
  .brand .sub{color:var(--muted);font-size:12px;letter-spacing:.04em}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .search{
    flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;
    background:var(--bg);border:1px solid var(--line);border-radius:2px;
    padding:8px 10px;
  }
  .search:focus-within{border-color:var(--accent-dim)}
  .search input{
    background:transparent;border:0;color:var(--text);width:100%;
    font-family:var(--body);font-size:13px;outline:none;
  }
  .search svg{flex:none;color:var(--muted)}

  .btn{
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;
    background:var(--surface-2);color:var(--text);
    border:1px solid var(--line-2);border-radius:2px;
    padding:8px 11px;white-space:nowrap;transition:.12s;
  }
  .btn:hover{border-color:var(--accent-dim);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#06231f;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:#06231f}
  .btn.ghost{background:transparent}
  .btn.danger:hover{border-color:var(--atk);color:var(--atk)}

  /* tabs + filters */
  .tabrow{display:flex;gap:2px;margin-top:14px}
  .tab{
    font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    font-size:12px;color:var(--muted);cursor:pointer;
    padding:9px 16px;border:1px solid transparent;border-bottom:2px solid transparent;
    background:transparent;
  }
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .tab:hover{color:var(--text)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
  .filters .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
  .chip{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    padding:5px 10px;border:1px solid var(--line-2);border-radius:2px;
    color:var(--muted);cursor:pointer;background:transparent;transition:.12s;
  }
  .chip:hover{color:var(--text)}
  .chip.active{color:var(--bg);background:var(--text);border-color:var(--text);font-weight:700}
  .chip .sep{opacity:.35;margin:0 4px}

  /* ---------- Main / grid ---------- */
  main{padding:18px;max-width:1200px;margin:0 auto}
  .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px;letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

  .card{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--line-2);border-radius:3px;padding:13px 14px;cursor:pointer;
    transition:.13s;overflow:hidden;
  }
  .card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .card.t-attack{border-left-color:var(--atk)}
  .card.t-defense{border-left-color:var(--def)}
  .card.t-stamina{border-left-color:var(--sta)}
  .card.t-balance{border-left-color:var(--bal)}
  .card.t-ratchet{border-left-color:#9AA6BC}
  .card.t-lockchip{border-left-color:#E8C34A}
  .card.t-mainblade{border-left-color:#2DE0D0}
  .card.t-assistblade{border-left-color:#F59E5B}
  .card.t-metalblade{border-left-color:#C8CEDA}
  .card.t-overblade{border-left-color:#E879F9}
  .thumb.failed::after,.hero.failed::after{
    content:"Image blocked";font-family:var(--mono);font-size:10px;color:var(--atk);letter-spacing:.06em;
  }
  .card .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .card .nm{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;margin:3px 0 8px;line-height:1.1}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .card .vcount{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .card .vcount b{color:var(--accent)}

  .pill{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);color:var(--muted)}
  .pill.type{border:none;font-weight:700}
  .pill.type.attack{background:rgba(255,82,87,.14);color:var(--atk)}
  .pill.type.defense{background:rgba(61,165,255,.14);color:var(--def)}
  .pill.type.stamina{background:rgba(57,217,138,.14);color:var(--sta)}
  .pill.type.balance{background:rgba(185,139,255,.14);color:var(--bal)}
  .pill.sys{color:var(--accent);border-color:var(--accent-dim)}
  .pill.code{background:var(--surface-2);color:var(--text);border-color:var(--line-2);font-weight:700}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:4px}
  .empty b{color:var(--text);display:block;font-family:var(--display);font-size:16px;margin-bottom:6px;letter-spacing:.03em}

  /* ---------- Products view ---------- */
  .prod{background:var(--surface);border:1px solid var(--line);border-radius:3px;margin-bottom:10px}
  .prod .phead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .prod .phead .pn{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em}
  .prod .phead .pd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  .prod .pbody{padding:6px 14px 12px}
  .vrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .vrow:last-child{border-bottom:none}
  .vrow .vn{font-weight:500;cursor:pointer}
  .vrow .vn:hover{color:var(--accent)}
  .vrow .vc{font-family:var(--mono);font-size:11px;color:var(--muted)}

  /* ---------- Detail drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,6,10,.6);opacity:0;pointer-events:none;transition:.18s;z-index:40}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;
    background:var(--surface);border-left:1px solid var(--line);z-index:50;
    transform:translateX(102%);transition:.22s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0)}
  .dhead{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative}
  .dhead .kind{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .dhead .nm{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:4px 0 10px;line-height:1.05}
  .dhead .close{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:2px;width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1}
  .dhead .close:hover{color:var(--atk);border-color:var(--atk)}
  .dbody{padding:16px 18px;overflow-y:auto;flex:1}

  .specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .spec{background:var(--surface-2);padding:10px 12px}
  .spec .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .spec .v{font-family:var(--display);font-weight:600;font-size:17px;margin-top:2px}
  .spec.full{grid-column:1/3}
  .spec .v.small{font-size:13px;font-family:var(--body);font-weight:500;color:var(--text)}

  .sectitle{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .sectitle::after{content:"";flex:1;height:1px;background:var(--line)}

  table.vt{width:100%;border-collapse:collapse;font-size:12px}
  table.vt th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.vt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.vt tr:hover td{background:rgba(255,255,255,.02)}
  .rar{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:2px;text-transform:uppercase}
  .rar.Standard{background:var(--surface-2);color:var(--muted)}
  .rar.Rare{background:rgba(255,82,87,.16);color:var(--atk)}
  .rar.Special{background:rgba(45,224,208,.16);color:var(--accent)}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid rgba(255,255,255,.2);vertical-align:middle}
  .vdel{cursor:pointer;color:var(--muted);background:none;border:none;font-size:13px}
  .vdel:hover{color:var(--atk)}
  .drawer-actions{display:flex;gap:8px;margin-top:16px}
  .combo{padding:9px 0;border-bottom:1px dashed var(--line)}
  .combo:last-child{border-bottom:none}
  .chead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px}
  .chead .cname{font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:.02em}
  .chead .ccol{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .chead .ctot{font-family:var(--mono);font-size:10.5px;color:var(--sta);margin-left:auto}
  .cparts{display:flex;flex-wrap:wrap;gap:5px}
  .cchip{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;cursor:pointer;
    padding:3px 8px;border-radius:2px;border:1px solid var(--line-2);
    background:var(--surface-2);color:var(--text);transition:.12s;
  }
  .cchip:hover{border-color:var(--accent-dim);color:var(--accent)}
  .cchip .cfull{color:var(--muted)}
  .cchip.b-attack{border-left:2px solid var(--atk)}
  .cchip.b-defense{border-left:2px solid var(--def)}
  .cchip.b-stamina{border-left:2px solid var(--sta)}
  .cchip.b-balance{border-left:2px solid var(--bal)}
  .cchip.b-ratchet{border-left:2px solid #9AA6BC}
  .cchip.b-lockchip{border-left:2px solid #E8C34A}
  .cchip.b-mainblade{border-left:2px solid #2DE0D0}
  .cchip.b-assistblade{border-left:2px solid #F59E5B}
  .cchip.b-metalblade{border-left:2px solid #C8CEDA}
  .cchip.b-overblade{border-left:2px solid #E879F9}
  .leftover{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .leftover .lhead{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .pill.price{color:var(--sta);border-color:rgba(57,217,138,.4)}
  .prod .psrc{margin-left:6px;color:var(--muted);text-decoration:none;font-size:13px}
  .prod .psrc:hover{color:var(--accent)}
  .pnone{color:var(--muted);font-size:11.5px;padding:6px 0 2px;font-style:italic}
  .statblock{margin-bottom:20px}
  .statrow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .statrow .sl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:0 0 62px}
  .statrow .sb{flex:1;height:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .statrow .sb i{display:block;height:100%;border-radius:1px}
  .statrow .sv{font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 24px;text-align:right}
  .spec .v small{font-size:11px;font-weight:500;color:var(--muted);font-family:var(--body)}
  .card .wt{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
  .vw{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;margin-top:3px}
  .srcline{font-family:var(--mono);font-size:11px;color:var(--muted);margin:-11px 0 18px;letter-spacing:.03em}
  .srcline a{color:var(--accent);text-decoration:none}
  .srcline a:hover{text-decoration:underline}
  .vsrc{text-decoration:none;font-size:13px;padding:2px 4px;white-space:nowrap}
  .vsrc.k-package{color:var(--accent-dim)}
  .vsrc.k-part{color:var(--muted);font-size:11px}
  .vsrc.k-search{color:var(--muted);font-size:11px;opacity:.7}
  .vsrc:hover{color:var(--accent)}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;background:rgba(4,6,10,.65);
  }
  .modal.show{display:flex}
  .sheet{background:var(--surface);border:1px solid var(--line-2);border-radius:4px;width:460px;max-width:100%;padding:20px}
  .sheet h3{font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:16px;margin:0 0 16px}
  .field{margin-bottom:12px}
  .field label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:2px;
    color:var(--text);font-family:var(--body);font-size:13px;padding:9px 10px;outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-dim)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .hint{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:-6px;margin-bottom:12px}

  /* toast */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#06231f;font-family:var(--mono);font-size:12px;font-weight:700;
    padding:10px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:.2s;z-index:80;letter-spacing:.03em}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Images ---------- */
  .thumb{
    position:relative;width:100%;aspect-ratio:5/4;margin-bottom:10px;
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 7px,transparent 7px 14px),
      var(--bg);
    border:1px solid var(--line);border-radius:2px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .thumb .ph{font-family:var(--display);font-size:24px;font-weight:700;color:var(--line-2);letter-spacing:.08em}

  .hero{
    position:relative;width:100%;aspect-ratio:4/3;margin-bottom:18px;
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 8px,transparent 8px 16px),
      var(--bg);
    border:1px solid var(--line);border-radius:3px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .hero img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
  .hero .ph{font-family:var(--display);font-size:44px;font-weight:700;color:var(--line-2);letter-spacing:.08em}
  .hero .heroadd{
    position:absolute;bottom:8px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;background:rgba(11,13,18,.82);border:1px solid var(--line-2);
    color:var(--muted);border-radius:2px;padding:5px 9px;cursor:pointer;
  }
  .hero .heroadd:hover{color:var(--accent);border-color:var(--accent-dim)}

  .vthumb{
    width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:2px;
    background:var(--bg);object-fit:contain;cursor:zoom-in;display:block;
  }

  .lightbox{position:fixed;inset:0;z-index:90;background:rgba(4,6,10,.93);display:none;align-items:center;justify-content:center;padding:34px;cursor:zoom-out}
  .lightbox.show{display:flex}
  .lightbox img{max-width:min(900px,92vw);max-height:84vh;object-fit:contain}
  .lightbox .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}

  .imgpick{display:flex;gap:11px;align-items:flex-start}
  .imgpick .prev{
    width:70px;height:70px;flex:none;border:1px dashed var(--line-2);border-radius:2px;
    background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--mono);font-size:9px;color:var(--muted);text-align:center;line-height:1.3;padding:4px;
  }
  .imgpick .prev.drag{border-color:var(--accent);background:rgba(45,224,208,.06)}
  .imgpick .prev img{width:100%;height:100%;object-fit:contain}
  .imgpick .side{flex:1;min-width:0}
  .imgpick .side .btnrow{display:flex;gap:6px;margin-top:6px}
  .imgpick .btn{padding:6px 9px;font-size:10px}

  .meter{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
  .meter .bar{width:52px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
  .meter .bar i{display:block;height:100%;width:0;background:var(--accent);transition:.2s}
  .meter.warn .bar i{background:var(--atk)}
  .meter.warn{color:var(--atk)}

  @media(max-width:720px){
    .drawer{width:100vw;max-width:100vw}
    .brand h1{font-size:18px}
    .tab{padding:9px 12px;font-size:11px}
    main{padding:14px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>BEYBLADE <span class="x">X</span> · PARTS INDEX</h1>
      <span class="sub" id="tagline">Blades · Ratchets · Bits — variants &amp; packaging</span>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="Search parts, products, bit codes…" autocomplete="off"/>
      </div>
      <button class="btn primary" data-action="add-part">+ Part</button>
      <button class="btn ghost" data-action="export">Export</button>
      <button class="btn ghost" data-action="export-links">Links CSV</button>
      <button class="btn ghost" data-action="import">Import</button>
      <button class="btn ghost danger" data-action="reset">Reset</button>
      <span class="meter" id="meter" title="Space used by uploaded images"><span class="bar"><i></i></span><span id="meter-t">0 KB</span></span>

"use strict";

/* ============================================================
   Storage layer — persists across sessions via window.storage,
   with an in-memory fallback if storage is unavailable.
   ============================================================ */
const KEY    = "bxdb:v2";      // parts, products, variants (small — loads fast)
const IMGKEY = "bxdb:img:v1";  // uploaded image data, kept separate so it never slows the index

/* Read-only when served from GitHub Pages — that copy is a link handed to
   other people, so it drops every editing control. Opened locally (file://,
   localhost) the file stays fully editable, which is how the dataset is
   maintained. Not a security boundary: storage is per-browser either way,
   so nobody can reach anyone else's data. It just removes the footguns. */
const READ_ONLY = /\.github\.io$/i.test(location.hostname);

/* Storage runs on the best backend available:
     cloud  — window.storage, when running inside Claude
     idb    — IndexedDB, when you open this file locally (much more room)
     memory — last resort, this session only
   IndexedDB is only ever touched when window.storage is absent. */
let backend = "memory";
const mem = {};

const idb = {
  _db:null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      const r = indexedDB.open("beybladeXParts", 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
      r.onsuccess = ()=>{ this._db = r.result; res(this._db); };
      r.onerror   = ()=> rej(r.error);
    });
  },
  async get(k){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const q = db.transaction("kv","readonly").objectStore("kv").get(k);
      q.onsuccess = ()=> res(q.result === undefined ? null : q.result);
      q.onerror   = ()=> rej(q.error);
    });
  },
  async set(k,v){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const q = db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      q.onsuccess = ()=> res();
      q.onerror   = ()=> rej(q.error);
    });
  }
};

async function detectBackend(){
  if(window.storage && window.storage.get){ backend = "cloud"; return; }
  try{
    if(window.indexedDB){ await idb.open(); backend = "idb"; return; }
  }catch(e){ /* blocked (private mode, file:// restrictions) */ }
  backend = "memory";
}

/* How much room uploaded images get, per backend. */
function imgBudget(){
  return backend === "cloud" ? 4.5*1024*1024
       : backend === "idb"   ? 250*1024*1024
       : 25*1024*1024;
}

const store = {
  async load(k){
    try{
      if(backend === "cloud"){
        const r = await window.storage.get(k);
        return r ? JSON.parse(r.value) : null;
      }
      if(backend === "idb"){
        const v = await idb.get(k);
        return v ? JSON.parse(v) : null;
      }
    }catch(e){ /* key doesn't exist yet, or backend unavailable */ }
    return mem[k] ? JSON.parse(mem[k]) : null;
  },
  async save(k, data){
    const s = JSON.stringify(data);
    mem[k] = s;
    try{
      if(backend === "cloud") await window.storage.set(k, s);
      else if(backend === "idb") await idb.set(k, s);
    }catch(e){ toast("Couldn't save — storage may be full"); }
  }
};

/* --- Image references -------------------------------------
   A part/variant .img is one of:
     null                 no image
     "https://…"          linked from the web (costs no storage)
     "i:abc123"           uploaded, stored locally in `imgs`
   ---------------------------------------------------------- */
function imgSrc(ref){
  if(!ref) return null;
  if(ref.startsWith("i:")) return imgs[ref] || null;
  return ref; // http(s) or a raw data: URL staged in a form
}
function putImage(dataURL){
  const id = "i:" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  imgs[id] = dataURL;
  return id;
}
/* Best image for a part: its own, else the first variant that has one. */
function partImage(p){
  if(p.img) return p.img;
  const v = db.variants.find(v=>v.partId===p.id && v.img);
  return v ? v.img : null;
}
/* Drop any stored image no longer referenced by a part or variant. */
function gcImages(){
  const used = new Set();
  db.parts.forEach(p=>{ if(p.img) used.add(p.img); });
  db.variants.forEach(v=>{ if(v.img) used.add(v.img); });
  Object.keys(imgs).forEach(k=>{ if(!used.has(k)) delete imgs[k]; });
}
/* Shrink an uploaded file so a full collection fits in storage.
   Flattened onto the card background, so PNG transparency still looks right. */
function downscale(file, max=440, quality=0.72){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error("Couldn't read that file"));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>reject(new Error("That file isn't a readable image"));
      im.onload = ()=>{
        let w = im.naturalWidth, h = im.naturalHeight;
        const s = Math.min(1, max / Math.max(w,h));
        w = Math.max(1, Math.round(w*s));
        h = Math.max(1, Math.round(h*s));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#12161F";
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(im,0,0,w,h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  const b = imgBytes(), pct = Math.min(100, b / imgBudget() * 100);
  const m = $("#meter"); if(!m) return;
  m.classList.toggle("warn", pct > 80);
  m.querySelector("i").style.width = pct.toFixed(1) + "%";

          : backend === "idb"   ? "Images saved in this browser (IndexedDB) · plenty of room"
          : "This session only — changes will be lost on refresh. Use Export to keep them.";
  m.style.color = backend === "memory" ? "var(--atk)" : "";
}

/* ============================================================
   Dataset versioning.
   The app loads your saved copy on startup, so a corrected or
   expanded dataset would otherwise never reach anyone who had
   already used it. Bumping SEED_VERSION rebuilds from the new
   seed while carrying over everything you added yourself:
   your photos, your own parts and variants, your own product
   codes. Parts you deleted that are part of the seed will come
   back, since a deletion can't be told apart from never having
   had the record.
   ============================================================ */
const SEED_VERSION = 9;

function migrate(oldDb){
  const fresh = seed();
  fresh.seedVersion = SEED_VERSION;
  if(!oldDb || !oldDb.parts) return fresh;

  // 1. Carry your photos onto the matching parts in the new seed.
  const oldParts = {};
  (oldDb.parts||[]).forEach(p=>{ oldParts[p.id] = p; });
  const freshIds = new Set(fresh.parts.map(p=>p.id));
  fresh.parts.forEach(p=>{
    const o = oldParts[p.id];
    if(o && o.img) p.img = o.img;
  });

  // 2. Keep parts you created yourself (anything the seed doesn't define).
  (oldDb.parts||[]).forEach(p=>{
    if(!freshIds.has(p.id)) fresh.parts.push(p);
  });

  // 3. Variants: try an exact colour match first, then fall back to the
  //    combo spec, which is far more stable than my colour wording. Only
  //    photos are carried across; the seed's own facts win. Anything that
  //    matches nothing is kept as a variant of yours.
  const exact = v => v.partId+"|"+v.productCode+"|"+(v.combo||"")+"|"+(v.color||"");
  const loose = v => v.partId+"|"+v.productCode+"|"+(v.combo||"");
  const byExact = {}, byLoose = {};
  fresh.variants.forEach(v=>{
    byExact[exact(v)] = v;
    if(!(loose(v) in byLoose)) byLoose[loose(v)] = v;
  });
  let nextId = fresh.variants.length;
  (oldDb.variants||[]).forEach(v=>{
    const match = byExact[exact(v)] || byLoose[loose(v)];
    if(match){ if(v.img && !match.img) match.img = v.img; }
    else { fresh.variants.push({...v, id:"u"+(++nextId)}); }
  });

  // 4. Keep any product codes you added that the seed doesn't define.
  Object.keys(oldDb.productMeta||{}).forEach(code=>{
    if(!fresh.productMeta[code]) fresh.productMeta[code] = oldDb.productMeta[code];
  });

  return fresh;
}

/* ============================================================
   Generated part art.
   Every part draws its own diagram from its own data, so the index
   is never a wall of blank tiles and works with no network at all.
   A photo you add always takes precedence over the drawing.
   ============================================================ */
const KIND_LABEL = {
  blade:"Blade", ratchet:"Ratchet", bit:"Bit",
  lockchip:"Lock Chip", mainblade:"Main Blade", assistblade:"Assist Blade",
  metalblade:"Metal Blade", overblade:"Over Blade"
};
const ART_COLOR = {
  Attack:"#FF5257", Defense:"#3DA5FF", Stamina:"#39D98A", Balance:"#B98BFF"
};
function artColor(p){
  if(p.kind==="blade")  return ART_COLOR[p.bladeType] || "#8A93A6";
  if(p.kind==="bit")    return ART_COLOR[p.bitType]   || "#8A93A6";
  if(p.kind==="ratchet")     return "#9AA6BC";
  if(p.kind==="lockchip")    return "#E8C34A";
  if(p.kind==="mainblade")   return "#2DE0D0";
  if(p.kind==="assistblade") return "#F59E5B";
  if(p.kind==="metalblade")  return "#C8CEDA";
  if(p.kind==="overblade")   return "#E879F9";
  return "#8A93A6";
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }

function starPath(n, cx, cy, R, r, rot){
  let d="";
  for(let i=0;i<2*n;i++){
    const rad = (i%2) ? r : R;
    const a = rot + i*Math.PI/n;
    d += (i?"L":"M") + (cx+rad*Math.cos(a)).toFixed(1) + "," + (cy+rad*Math.sin(a)).toFixed(1);
  }
  return d+"Z";
}
function gearTeeth(cx, cy, r, n, col){
  let out="";
  for(let i=0;i<n;i++){
    const a=i*2*Math.PI/n;
    out+=`<rect x="${(cx+r*Math.cos(a)-1.6).toFixed(1)}" y="${(cy+r*Math.sin(a)-1.6).toFixed(1)}" width="3.2" height="3.2" fill="${col}" transform="rotate(${(a*180/Math.PI).toFixed(0)} ${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)})"/>`;
  }
  return out;
}

/* Standard game-type iconography — sword / shield / hourglass / scale —
   drawn as original flat vector shapes in a 0-100 box centred on (50,50).
   These are the conventional symbols for Attack/Defense/Stamina/Balance
   used across strategy games generally, not a reproduction of any single
   game's trademarked logo. */
function typeIconPaths(type, col){
  switch(type){
    case "Attack": return `
      <polygon points="50,17 59,60 41,60" fill="${col}"/>
      <rect x="33" y="60" width="34" height="6" rx="2" fill="${col}"/>
      <rect x="45" y="66" width="10" height="17" rx="2" fill="${col}"/>
      <circle cx="50" cy="87" r="5.5" fill="${col}"/>`;
    case "Defense": return `
      <path d="M50,16 L76,26 L76,50 Q76,73 50,86 Q24,73 24,50 L24,26 Z" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="5" stroke-linejoin="round"/>`;
    case "Stamina": return `
      <rect x="32" y="15" width="36" height="4.5" rx="2" fill="${col}"/>
      <rect x="32" y="80.5" width="36" height="4.5" rx="2" fill="${col}"/>
      <path d="M34,19.5 L66,19.5 L66,27 L52,50 L66,73 L66,80.5 L34,80.5 L34,73 L48,50 L34,27 Z" fill="${col}"/>`;
    case "Balance": return `
      <line x1="50" y1="22" x2="50" y2="66" stroke="${col}" stroke-width="4.5"/>
      <polygon points="50,64 38,85 62,85" fill="${col}"/>
      <line x1="22" y1="32" x2="78" y2="32" stroke="${col}" stroke-width="4.5"/>
      <circle cx="50" cy="32" r="4.5" fill="${col}"/>
      <line x1="22" y1="32" x2="15" y2="51" stroke="${col}" stroke-width="3"/>
      <line x1="22" y1="32" x2="29" y2="51" stroke="${col}" stroke-width="3"/>
      <path d="M12,51 a9,7 0 0 0 18,0" fill="none" stroke="${col}" stroke-width="3"/>
      <line x1="78" y1="32" x2="71" y2="51" stroke="${col}" stroke-width="3"/>
      <line x1="78" y1="32" x2="85" y2="51" stroke="${col}" stroke-width="3"/>
      <path d="M68,51 a9,7 0 0 0 18,0" fill="none" stroke="${col}" stroke-width="3"/>`;
    default: return "";
  }
}
/* Places a small copy of a type icon at (cx,cy) at the given scale,
   with a backing plate so it reads clearly over other artwork. */
function typeIconBadge(type, col, cx, cy, s){
  if(!type) return "";
  const tx = (cx - 50*s).toFixed(1), ty = (cy - 50*s).toFixed(1);
  return `<circle cx="${cx}" cy="${cy}" r="${(50*s*0.42).toFixed(1)}" fill="var(--bg)" stroke="${col}" stroke-width="1.4"/>
          <g transform="translate(${tx},${ty}) scale(${s})">${typeIconPaths(type,col)}</g>`;
}

/* Returns inline SVG markup, sized to fill its container. */
function partArt(p){
  const col = artColor(p);
  const dim = "#39414F";
  const W = 100, H = 100;
  let body = "";

  if(p.kind === "blade"){
    // The type icon (sword/shield/hourglass/scale) is the whole story here.
    body =
      `<circle cx="50" cy="50" r="40" fill="none" stroke="${dim}" stroke-width="1"/>
       ${typeIconPaths(p.bladeType, col)}`;
  }

  else if(p.kind === "ratchet"){
    // Top view shows the real side count; the bar shows the real height in mm.
    const n = (p.sides === "M" || !p.sides) ? 6 : p.sides;
    const isM = p.sides === "M";
    const zero = n === 0;
    let top = `<circle cx="50" cy="42" r="26" fill="none" stroke="${dim}" stroke-width="1"/>`;
    if(zero || isM){
      top += `<circle cx="50" cy="42" r="21" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="2"/>`;
      if(isM) top += `<text x="50" y="47" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="${col}">M</text>`;
    }else{
      top += `<path d="${starPath(n,50,42,22,15,-Math.PI/2)}" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    }
    top += `<circle cx="50" cy="42" r="6" fill="none" stroke="${col}" stroke-width="1.6"/>`;
    // height bar: 50–85 mm mapped across the width
    const hmm = p.heightMm || 60;
    const frac = Math.max(0, Math.min(1, (hmm-50)/35));
    top += `<rect x="18" y="78" width="64" height="5" rx="2.5" fill="${dim}"/>
            <rect x="18" y="78" width="${(64*frac).toFixed(1)}" height="5" rx="2.5" fill="${col}"/>
            <text x="18" y="94" font-family="monospace" font-size="9" fill="${col}">${hmm} mm</text>
            <text x="82" y="94" text-anchor="end" font-family="monospace" font-size="9" fill="${dim}">${isM?"M":n} side${(!isM&&n===1)?"":"s"}</text>`;
    body = top;
  }

  else if(p.kind === "bit"){
    // Side profile of the tip, shaped by what the bit actually does.
    const nm = (p.fullName||"").toLowerCase();
    const gear = nm.includes("gear");
    let tip;
    if(nm.includes("flat"))            tip = `<path d="M32,74 L68,74 L64,60 L36,60 Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    else if(nm.includes("needle"))     tip = `<path d="M50,80 L57,58 L43,58 Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    else if(nm.includes("spike"))      tip = `<path d="M50,82 L56,58 L44,58 Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    else if(nm.includes("ball")||nm.includes("orb")) tip = `<circle cx="50" cy="66" r="15" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2"/>`;
    else if(nm.includes("point")||nm.includes("taper")) tip = `<path d="M50,79 Q60,64 58,58 L42,58 Q40,64 50,79 Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    else if(nm.includes("rush")||nm.includes("kick")||nm.includes("accel")) tip = `<path d="M34,74 L66,74 L60,58 L40,58 Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    else                                tip = `<path d="M50,78 Q62,66 59,58 L41,58 Q38,66 50,78 Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    body =
      `<rect x="38" y="24" width="24" height="16" rx="2" fill="none" stroke="${dim}" stroke-width="1.6"/>
       <rect x="42" y="40" width="16" height="18" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="1.6"/>
       ${tip}
       ${gear ? gearTeeth(50,66,19,8,col) : ""}
       <line x1="20" y1="84" x2="80" y2="84" stroke="${dim}" stroke-width="1.5" stroke-dasharray="3 3"/>
       ${typeIconBadge(p.bitType, col, 80, 18, 0.34)}`;
  }

  else if(p.kind === "lockchip"){
    body =
      `<path d="${starPath(6,50,50,26,20,-Math.PI/2)}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
       <circle cx="50" cy="50" r="9" fill="none" stroke="${col}" stroke-width="1.8"/>
       <text x="50" y="88" text-anchor="middle" font-family="monospace" font-size="9" fill="${dim}">LOCK CHIP</text>`;
  }

  else if(p.kind === "mainblade"){
    const n = 3 + (hash(p.name) % 4);
    body =
      `<circle cx="50" cy="48" r="36" fill="none" stroke="${dim}" stroke-width="1"/>
       <path d="${starPath(n,50,48,34,21,-Math.PI/2)}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
       <circle cx="50" cy="48" r="13" fill="none" stroke="${dim}" stroke-width="1.6" stroke-dasharray="3 3"/>
       <text x="50" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="${dim}">MAIN BLADE</text>`;
  }

  else if(p.kind === "assistblade"){
    const n = 3 + (hash(p.name) % 5);
    body =
      `<circle cx="50" cy="48" r="30" fill="none" stroke="${dim}" stroke-width="1"/>
       <path d="${starPath(n,50,48,28,18,-Math.PI/2)}" fill="${col}" fill-opacity=".2" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
       <circle cx="50" cy="48" r="10" fill="var(--bg)" stroke="${col}" stroke-width="1.8"/>
       <text x="50" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="${dim}">ASSIST BLADE</text>`;
  }

  else if(p.kind === "metalblade"){
    // Die-cast: drawn heavy, with a solid weighted rim.
    const n = 3 + (hash(p.name) % 4);
    body =
      `<circle cx="50" cy="48" r="35" fill="none" stroke="${dim}" stroke-width="1"/>
       <path d="${starPath(n,50,48,33,24,-Math.PI/2)}" fill="${col}" fill-opacity=".26" stroke="${col}" stroke-width="4" stroke-linejoin="round"/>
       <circle cx="50" cy="48" r="12" fill="none" stroke="${col}" stroke-width="2.4"/>
       <text x="50" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="${dim}">METAL BLADE</text>`;
  }

  else if(p.kind === "overblade"){
    // Plastic shell that caps the Metal Blade — drawn as a light outline.
    const n = 3 + (hash(p.name) % 5);
    body =
      `<circle cx="50" cy="48" r="35" fill="none" stroke="${dim}" stroke-width="1" stroke-dasharray="3 3"/>
       <path d="${starPath(n,50,48,33,20,-Math.PI/2)}" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
       <circle cx="50" cy="48" r="15" fill="none" stroke="${col}" stroke-width="1.4" stroke-dasharray="4 3"/>
       <text x="50" y="92" text-anchor="middle" font-family="monospace" font-size="9" fill="${dim}">OVER BLADE</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(p.name)} diagram">${body}</svg>`;
}

/* ============================================================
   Render — grid / products / count / filters
   ============================================================ */
function matches(p){
  if(ui.kind!=="all" && p.kind!==ui.kind) return false;
  if(ui.system!=="all" && p.system!==ui.system) return false;
  if(ui.q){
    const q=ui.q.toLowerCase();
    const hay=[p.name,p.fullName,p.bladeType,p.bitType,p.system,p.debut,KIND_LABEL[p.kind]].filter(Boolean).join(" ").toLowerCase();
    // also match by a product code the part appears in
    const inProd = variantsFor(p.id).some(v=>v.productCode.toLowerCase().includes(q));
    if(!hay.includes(q) && !inProd) return false;
  }
  return true;
}

function render(){
  // filter active states
  document.querySelectorAll('[data-action="kind"]').forEach(b=>b.classList.toggle("active",b.dataset.val===ui.kind));
  document.querySelectorAll('[data-action="system"]').forEach(b=>b.classList.toggle("active",b.dataset.val===ui.system));
  document.querySelectorAll('[data-action="view"]').forEach(b=>b.classList.toggle("active",b.dataset.val===ui.view));
  $("#filters").style.display = (ui.view==="parts") ? "flex" : "none";

  if(ui.view==="products"){ renderProducts(); }
  else { renderParts(); }
}

/* Product codes in this app sometimes carry a "-01"/"-02" suffix for
   sub-variants (e.g. "CX-05-01"); kyoganken indexes by the base code. */
function kyogankenBase(code){
  const m = (code||"").match(/^([A-Za-z]{2}-\d+)/);

}

function kyoPartURL(partId){ return KYOPARTS[partId] || null; }

/* Domain shown in link labels, derived from the URL itself so the
   label is always honest about which page it actually points to. */
function hostLabel(url){
  try{ const u=new URL(url); const f=u.pathname.split("/").pop(); return f ? u.hostname+" / "+f : u.hostname; }catch(e){ return url; }
}

/* Part-level link: this part's own definition page on kyoganken's
   parts index (most specific -- a bit links to the bit's own page,
   not the box it happened to ship in). */
function findPartURL(p){
  // A URL you typed in yourself always wins -- that's how a newly
  // released part gets a proper source link without a code change.
  if(p.srcUrl) return { url:p.srcUrl, direct:true, kind:"part" };
  const direct = kyoPartURL(p.id);
  if(direct) return { url:direct, direct:true, kind:"part" };
  const q = ["Beyblade X", p.name, KIND_LABEL[p.kind]||"", "kyoganken"].filter(Boolean).join(" ");
  return { url:"https://www.google.com/search?q="+encodeURIComponent(q), direct:false, kind:"search" };
}

/* Variant-level link, in order of how specific it is:
     1. the exact release page, when the product code maps to one
     2. the part's own kyoganken page, which documents its variations
     3. a web search, only if the part isn't on kyoganken at all
   Step 2 matters because Takara Tomy numbers every limited, prize and
   collab release BX-00 / UX-00 / CX-00, so those can never resolve to
   one package page -- but they are still covered on the part's own
   page, which beats dropping the reader into a search engine. */
function findVariantURL(p, v){
  const pkg = kyogankenURL(v.productCode);
  if(pkg) return { url:pkg, direct:true, kind:"package" };

/* ============================================================
   Combo reconstruction.
   A product ships an assembled Beyblade, not a pile of parts, so the
   Products view is built around the combo. A combo string like
   "3-60F" or "BK1-50I" decomposes into ratchet + bit, plus the
   over/assist blade letters that Custom Line puts in front.
   ============================================================ */

/* "3-60F" -> {prefix:"",   ratchet:"3-60", bit:"F"}
   "S6-60V" -> {prefix:"S",  ratchet:"6-60", bit:"V"}
   "BK1-50I"-> {prefix:"BK", ratchet:"1-50", bit:"I"}
   "M-85BS" -> {prefix:"",   ratchet:"M-85", bit:"BS"}   */
function parseCombo(combo, anchorPart){
  if(!combo || combo === "—") return null;
  const c = String(combo).trim();

  // A ratchet-integrated blade (UX Expand) has no separate ratchet,
  // so whatever follows the blade name is the bit.
  if(anchorPart && anchorPart.integrated){
    return { prefix:"", ratchet:null, bit:c };
  }

  // Standard: [over/assist letters][ratchet][bit]
  let m = c.match(/^([A-Za-z]{0,2})(\d+|M)-(\d+)([A-Za-z]{0,3})$/);
  if(m) return { prefix:m[1]||"", ratchet:m[2]+"-"+m[3], bit:m[4]||"" };

  // Turbo and Operate are ratchet-integrated bits, so combos using them
  // skip the ratchet entirely: "ATr", "HOp".
  m = c.match(/^([A-Za-z]{0,2})(Tr|Op)$/);
  if(m) return { prefix:m[1]||"", ratchet:null, bit:m[2] };

  return null;
}

/* Product names carry the combo, e.g. "Starter · Dran Brave S6-60V". */
function comboFromName(name){
  const s = String(name||"");
  let m = s.match(/([A-Za-z]{0,2}(?:\d+|M)-\d+[A-Za-z]{0,3})\s*$/);
  if(m) return m[1];
  m = s.match(/\s([A-Za-z]{0,2}(?:Tr|Op))\s*$/);   // integrated-bit combos
  return m ? m[1] : null;
}

function partByLetter(kind, letter){
  return db.parts.find(p=>p.kind===kind && p.letter===letter) || null;
}

/* Resolve a combo string into the actual parts it names.
   Custom Line puts one letter (assist blade) or two (over blade +
   assist blade) before the ratchet. */
function comboComponents(anchorPart, combo){
  const out = [anchorPart];
  const parsed = parseCombo(combo, anchorPart);
  if(!parsed) return out;

  if(parsed.prefix.length === 1){
    const ab = partByLetter("assistblade", parsed.prefix);
    if(ab) out.push(ab);
  }else if(parsed.prefix.length === 2){
    const ob = partByLetter("overblade",   parsed.prefix[0]);
    const ab = partByLetter("assistblade", parsed.prefix[1]);
    if(ob) out.push(ob);
    if(ab) out.push(ab);
  }
  if(parsed.ratchet){
    const r = partById("r-"+parsed.ratchet);
    if(r) out.push(r);
  }
  if(parsed.bit){
    const b = partById("bit-"+parsed.bit);
    if(b) out.push(b);
  }
  return out;
}

/* Build the combos a product contains, and report which of its
   recorded parts those combos account for. */
function productCombos(code, items){
  const meta = db.productMeta[code] || {};
  const nameCombo = comboFromName(meta.name);
  const combos = [];
  const accounted = new Set();

  const anchorKinds = ["blade","mainblade","metalblade"];
  items.forEach(v=>{
    const p = partById(v.partId);
    if(!p || !anchorKinds.includes(p.kind)) return;
    const combo = (v.combo && v.combo !== "—") ? v.combo : nameCombo;
    if(!combo) return;

    const parts = comboComponents(p, combo);
    // A Custom Line combo also needs its lock chip, which the combo
    // string never names -- it lives in the product name instead.
    let label = p.name + " " + combo;
    if(p.kind === "mainblade" || p.kind === "metalblade"){
      // Prefer the chip the variant names; a product can hold two
      // different Custom Line combos, so guessing the first lock chip
      // in the box gets it wrong.
      const lc = (v.chip && partById(v.chip))
              || items.map(x=>partById(x.partId)).find(x=>x && x.kind==="lockchip");
      if(lc){ parts.unshift(lc); label = lc.name + " " + label; }
    }
    parts.forEach(x=>accounted.add(x.id));

    const total = parts.reduce((sum,x)=> sum + (x.weightG||0), 0);
    const allWeighed = parts.every(x=>x.weightG!=null);
    combos.push({
      label,
      variant: v,
      parts,
      totalG: allWeighed ? Math.round(total*10)/10 : null
    });
  });

  // Random boosters number their contents 01..06; show them in that order.
  combos.sort((a,b)=>{
    const na = parseInt((a.variant.color||"").match(/^(\d+)/)?.[1] ?? "999", 10);
    const nb = parseInt((b.variant.color||"").match(/^(\d+)/)?.[1] ?? "999", 10);
    if(na !== nb) return na - nb;
    return a.label.localeCompare(b.label);
  });

  return { combos, accounted };
}

function renderProducts(){
  const groups = {};
  db.variants.forEach(v=>{ (groups[v.productCode]=groups[v.productCode]||[]).push(v); });

  let codes = Object.keys(db.productMeta);
  Object.keys(groups).forEach(c=>{ if(!codes.includes(c)) codes.push(c); });

  if(ui.q){
    const q = ui.q.toLowerCase();
    codes = codes.filter(c=>{
      const m = db.productMeta[c] || {};
      if(c.toLowerCase().includes(q)) return true;
      if((m.name||"").toLowerCase().includes(q)) return true;
      if((m.type||"").toLowerCase().includes(q)) return true;
      return (groups[c]||[]).some(v=>{ const pt=partById(v.partId); return pt && pt.name.toLowerCase().includes(q); });
    });
  }

  codes.sort((a,b)=>{
    const da=(db.productMeta[a]||{}).date||"", dbb=(db.productMeta[b]||{}).date||"";
    if(da && dbb && da!==dbb) return dbb.localeCompare(da);
    if(da && !dbb) return -1;
    if(!da && dbb) return 1;
    return a.localeCompare(b);
  });

  const withContents = codes.filter(c=>(groups[c]||[]).length).length;
  $("#count").textContent = codes.length + " products · " + withContents + " with contents recorded";

  if(!codes.length){
    $("#view").innerHTML = `<div class="empty"><b>No products match</b>Try clearing the search.</div>`;
    return;
  }

  $("#view").innerHTML = codes.map(code=>{
    const m = db.productMeta[code] || {name:code,type:"—",date:"",price:null};
    const items = groups[code] || [];
    const { combos, accounted } = productCombos(code, items);

    // Parts in the box that no reconstructed combo covers.
    const leftovers = items.filter(v=>{
      const p = partById(v.partId);
      return p && !accounted.has(p.id);
    });

    const comboHTML = combos.map(c=>{
      const rar = c.variant.rarity && c.variant.rarity!=="Standard"
        ? `<span class="rar ${c.variant.rarity}">${c.variant.rarity}</span>` : "";
      const chips = c.parts.map(x=>{
        const cls = x.kind==="blade" ? "b-"+(x.bladeType||"").toLowerCase()
                  : x.kind==="bit"   ? "b-"+(x.bitType||"").toLowerCase()
                  : "b-"+x.kind;
        const nm = x.kind==="bit" ? `${x.name}<span class="cfull"> ${esc(x.fullName||"")}</span>` : esc(x.name);
        return `<span class="cchip ${cls}" data-action="open" data-id="${x.id}" title="${esc(KIND_LABEL[x.kind]||x.kind)}${x.weightG!=null?" · "+x.weightG+" g":""}">${nm}</span>`;
      }).join("");
      return `<div class="combo">
        <div class="chead">
          <span class="cname">${esc(c.label)}</span>
          ${c.variant.color && c.variant.color!=="Standard" ? `<span class="ccol">${esc(c.variant.color)}</span>` : ""}
          ${rar}
          ${c.totalG!=null ? `<span class="ctot">${c.totalG} g assembled</span>` : ""}
        </div>
        <div class="cparts">${chips}</div>
      </div>`;
    }).join("");

    const isCatchAll = /-00$/.test(code);
    const isSet = /Set|Deck/.test(m.type||"");
    const leftHead = isCatchAll
      ? "Individually released parts under this code"
      : isSet ? "Spare parts included in the set"
      : combos.length ? "Also recorded in this release"
      : "Recorded parts — combos not yet reconstructed";
    const leftoverHTML = leftovers.length ? `
      <div class="leftover">
        <div class="lhead">${leftHead}</div>
        ${leftovers.map(v=>{
          const p = partById(v.partId);
          const rar = v.rarity && v.rarity!=="Standard" ? `<span class="rar ${v.rarity}">${v.rarity}</span>` : "";
          return `<div class="vrow">
            <span class="swatch" style="background:${swatchColor(v.color)}"></span>
            <span class="vn" data-action="open" data-id="${p.id}">${esc(p.name)}</span>
            <span class="vc">${esc(KIND_LABEL[p.kind]||p.kind)}</span>
            <span class="vc" style="color:var(--muted)">${esc(v.color)}</span>
            ${v.weightG!=null?`<span class="vc">${v.weightG} g</span>`:""}
            ${rar}
          </div>`;
        }).join("")}
      </div>` : "";

    const body = (combos.length || leftovers.length)
      ? comboHTML + leftoverHTML
      : `<div class="pnone">Contents not recorded yet${
          /Tool|Stadium/.test(m.type||"") ? " — this release contains no blade parts." : "."
        }</div>`;

    const src = kyogankenURL(code);
    return `<div class="prod">
      <div class="phead">
        <span class="pill code">${esc(code)}</span>
        <span class="pn">${esc(m.name)}</span>
        <span class="pill">${esc(m.type||"—")}</span>
        ${m.price?`<span class="pill price">¥${m.price.toLocaleString()}</span>`:""}
        ${combos.length>1?`<span class="pill">${combos.length} combos</span>`:""}
        <span class="pd">${esc(m.date||"—")}</span>
        ${src?`<a class="psrc" href="${src}" target="_blank" rel="noopener noreferrer" title="Open ${esc(code)} on kyoganken">&#8599;</a>`:""}
      </div>
      <div class="pbody">${body}</div>
    </div>`;
  }).join("");
}
function openDetail(id){
  ui.selected = id;
  const p = partById(id); if(!p) return;
  const kindLabel = KIND_LABEL[p.kind] || p.kind;
  $("#d-kind").textContent = kindLabel + " · " + p.system;
  $("#d-name").textContent = p.kind==="bit" ? (p.name+" · "+(p.fullName||"")) : p.name;

  let specs="";
  const spec=(k,v,cls)=>`<div class="spec ${cls||""}"><div class="k">${k}</div><div class="v ${cls&&cls.includes('full')?'small':''}">${v}</div></div>`;
  const dash = "<span style='color:var(--muted)'>&mdash;</span>";
  const wt = p.weightG!=null ? p.weightG+" <small>g</small>" : dash;
  const sz = p.sizeMm!=null ? p.sizeMm+" <small>mm</small>" : dash;

  /* Stat bar for the printed attack/defense/stamina triple. */
  const statBar = (label,val,col)=> val==null ? "" : `
    <div class="statrow">

      <span class="sb"><i style="width:${Math.min(100,val)}%;background:${col}"></i></span>

  const stats = (p.statAtk!=null||p.statDef!=null||p.statSta!=null) ? `
    <div class="sectitle">Printed stats</div>
    <div class="statblock">
      ${statBar("Attack",  p.statAtk, "var(--atk)")}
      ${statBar("Defense", p.statDef, "var(--def)")}
      ${statBar("Stamina", p.statSta, "var(--sta)")}
    </div>` : "";

  if(p.kind==="blade"){
    specs =
      `<div class="spec"><div class="k">Type</div><div class="v" style="color:${ART_COLOR[p.bladeType]||'var(--text)'}">${esc(p.bladeType)}</div></div>`+
      spec("Weight", wt)+
      spec("Size class", sz)+
      spec("Spin", esc(p.spin)+"-spin")+
      (p.integrated?`<div class="spec full"><div class="k">Construction</div><div class="v small">Ratchet-integrated &mdash; blade and ratchet are a single piece.</div></div>`:"")+
      (p.note?`<div class="spec full"><div class="k">Notes</div><div class="v small">${esc(p.note)}</div></div>`:"");
  }else if(p.kind==="ratchet"){
    specs = spec("Blades / sides", p.sides)+
      spec("Height", p.heightMm+" <small>mm</small>")+
      spec("Weight", wt)+
      spec("Structure", esc(p.structure||"&mdash;"))+
      `<div class="spec full"><div class="k">Naming</div><div class="v small"><b>${p.name}</b> = ${p.sides} upper contact point(s), ${p.heightMm} mm tall.${
        p.structure==="Simple" ? " Simple type uses an O-shaped joint and is notably lighter." : ""
      }</div></div>`;
  }else if(p.kind==="bit"){
    specs = spec("Category", `<span style="color:${ART_COLOR[p.bitType]||'var(--text)'}">${esc(p.bitType||'&mdash;')}</span>`)+
      spec("Weight", wt)+
      spec("Gear teeth", p.teeth!=null?p.teeth:dash)+
      spec("Burst resistance", p.burstRes!=null?p.burstRes:dash)+
      spec("Total height", p.totalHeightMm!=null?p.totalHeightMm+" <small>mm</small>":dash)+
      spec("Exposed height", p.exposedHeightMm!=null?p.exposedHeightMm+" <small>mm</small>":dash)+
      (p.integrated?`<div class="spec full"><div class="k">Construction</div><div class="v small">Ratchet-integrated &mdash; bit and ratchet are a single piece.</div></div>`:"")+
      (p.movement?`<div class="spec full"><div class="k">Movement</div><div class="v small">${esc(p.movement)}</div></div>`:"");
  }else if(p.kind==="assistblade"){
    specs = spec("Letter code", esc(p.letter||"&mdash;"))+
      spec("Weight", wt)+
      spec("Size class", sz)+
      spec("Thickness", p.heightMm!=null?p.heightMm+" <small>mm</small>":dash)+
      `<div class="spec full"><div class="k">Custom Line</div><div class="v small">Sits under the Main Blade and tunes weight and contact shape.</div></div>`;
  }else if(p.kind==="lockchip"){
    specs = spec("Weight", wt)+
      spec("Material", p.metal?"Metal":"Plastic")+
      spec("System", esc(p.system))+
      spec("Debut", esc(p.debut||"&mdash;"))+
      `<div class="spec full"><div class="k">Custom Line</div><div class="v small">Sits at the centre and gives the finished combo its name.${
        p.metal ? " Metal chips weigh roughly three times a standard plastic chip." : ""
      }</div></div>`;
  }else{
    const blurb = p.kind==="mainblade"  ? "The main striking body; pairs with a Lock Chip and an Assist Blade."
                : p.kind==="metalblade" ? "Infinity releases split the Main Blade in two: this is the die-cast half, worn under an Over Blade."
                : "The plastic shell that caps a Metal Blade on Custom Line Infinity releases.";
    specs = spec("Weight", wt)+
      spec("Size class", sz)+
      (p.letter?spec("Letter code", esc(p.letter)):spec("System", esc(p.system)))+
      spec("Debut", esc(p.debut||"&mdash;"))+
      `<div class="spec full"><div class="k">Custom Line</div><div class="v small">${blurb}</div></div>`;
  }

  const heroSrc = imgSrc(partImage(p));
  const hero = `<div class="hero">${
    heroSrc ? `<img src="${esc(heroSrc)}" alt="${esc(p.name)}" data-action="zoom" data-src="${esc(heroSrc)}" data-cap="${esc(p.name)}" onerror="this.closest('.hero').classList.add('failed');this.remove()"/>`
            : partArt(p)
  }${READ_ONLY?"":`<button class="heroadd" data-action="edit-part" data-id="${p.id}">${heroSrc?"Change photo":"+ Add photo"}</button>`}</div>`;

  const vs = variantsFor(id);
  const vtable = vs.length ? `
    <table class="vt"><thead><tr><th>Colour</th><th>Product</th><th>Combo</th><th>Rarity</th><th></th>${READ_ONLY?"":"<th></th>"}</tr></thead>
    <tbody>${vs.map(v=>{
      const m=db.productMeta[v.productCode]||{name:v.productCode,type:"",date:""};
      return `<tr>
        <td><div style="display:flex;align-items:center;gap:7px">${
          imgSrc(v.img)
            ? `<img class="vthumb" src="${esc(imgSrc(v.img))}" alt="" data-action="zoom" data-src="${esc(imgSrc(v.img))}" data-cap="${esc(p.name+" · "+v.color)}"/>`
            : `<span class="swatch" style="background:${swatchColor(v.color)}"></span>`
        }<span>${esc(v.color)}</span></div></td>
        <td><span class="pill code" style="font-size:9px">${esc(v.productCode)}</span>${m.type?`<span class="pill" style="font-size:8.5px;margin-left:4px">${esc(m.type)}</span>`:""}<div style="color:var(--muted);font-size:10px;margin-top:3px">${esc(m.name)}${m.date?" · "+esc(m.date):""}</div></td>
        <td style="font-family:var(--mono)">${esc(v.combo||"—")}${
          v.weightG!=null?`<div class="vw">${v.weightG} g measured</div>`:""}</td>
        <td>${v.rarity!=="Standard"?`<span class="rar ${v.rarity}">${v.rarity}</span>`:`<span style="color:var(--muted);font-size:10px">std</span>`}</td>
        <td>${(()=>{ const vf=findVariantURL(p,v);
          const label = p.kind==="bit" && p.fullName ? p.fullName : p.name;
          const tip = vf.kind==="package" ? "Open this release on "+hostLabel(vf.url)
                    : vf.kind==="part"    ? v.productCode+" covers many limited releases — opening the "+esc(label)+" part page instead"
                    : "Search the web";
          return `<a class="vsrc k-${vf.kind}" href="${vf.url}" target="_blank" rel="noopener noreferrer" title="${tip}">${
            vf.kind==="package" ? "&#8599;" : vf.kind==="part" ? "&#8901;&#8599;" : "&#63;"}</a>`;
        })()}</td>
        ${READ_ONLY?"":`<td><button class="vdel" data-action="del-variant" data-id="${v.id}" title="Remove">✕</button></td>`}
      </tr>`;
    }).join("")}</tbody></table>` :
    `<div style="color:var(--muted);font-size:12px;padding:4px 0 8px">No variants recorded yet.</div>`;

  const heroFind = findPartURL(p);
  const srcLine = `<div class="srcline">${
    heroFind.direct
      ? `Source: <a href="${heroFind.url}" target="_blank" rel="noopener noreferrer">${hostLabel(heroFind.url)} &#8599;</a>`
      : `Not on kyoganken — <a href="${heroFind.url}" target="_blank" rel="noopener noreferrer">search the web &#8599;</a>`
  }</div>`;

  $("#d-body").innerHTML =
    hero +
    srcLine +
    `<div class="specs">${specs}</div>
     ${stats}
     <div class="sectitle">Colour variants &amp; packaging (${vs.length})</div>
     ${vtable}
     ${READ_ONLY?"":`<div class="drawer-actions">
       <button class="btn primary" data-action="add-variant" data-id="${id}">+ Variant</button>
       <button class="btn" data-action="edit-part" data-id="${id}">Edit part</button>
       <button class="btn ghost danger" data-action="del-part" data-id="${id}">Delete</button>
     </div>`}`;

  $("#scrim").classList.add("show");
  $("#drawer").classList.add("show");
}

  formImg = initial || null;
  const url = $("#i-url");
  if(url && formImg && !formImg.startsWith("i:") && !formImg.startsWith("data:")) url.value = formImg;
  refreshPreview();
  if(url) url.addEventListener("input", ()=>{ formImg = url.value.trim() || null; refreshPreview(); });
  const box = $("#i-prev");
  if(box){
    ["dragenter","dragover"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.classList.add("drag");}));
    ["dragleave","drop"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.classList.remove("drag");}));
    box.addEventListener("drop", e=>{ const f=e.dataTransfer.files[0]; if(f) acceptImageFile(f); });
    box.addEventListener("click", ()=>$("#imgFile").click());
  }
}
async function acceptImageFile(file){
  if(!file.type.startsWith("image/")){ toast("That's not an image file"); return; }
  try{
    const data = await downscale(file);
    if(imgBytes() + data.length > imgBudget()){
      toast("Image storage is full — link URLs instead"); return;
    }
    formImg = data;
    const url = $("#i-url"); if(url) url.value = "";
    refreshPreview();
  }catch(err){ toast(err.message); }
}
/* Convert a staged raw upload into a stored image right before saving. */
function commitImg(){
  if(formImg && formImg.startsWith("data:")) return putImage(formImg);
  return formImg || null;
}

function partForm(existing){
  const p = existing || {kind:"blade",system:"BX",spin:"Right",bladeType:"Attack"};
  const editing = !!existing;
  const sel=(cur,opts)=>opts.map(o=>`<option value="${o}" ${o===cur?"selected":""}>${o}</option>`).join("");
  openModal(`
    <h3>${editing?"Edit part":"Add part"}</h3>
    <div class="field"><label>Category</label>
      <select id="f-kind" ${editing?"disabled":""}>${
        ["blade","ratchet","bit","lockchip","mainblade","assistblade","metalblade","overblade"]
          .map(k=>`<option value="${k}" ${k===p.kind?"selected":""}>${KIND_LABEL[k]}</option>`).join("")
      }</select></div>
    <div class="field"><label>Name / code</label>
      <input id="f-name" value="${esc(p.name||"")}" placeholder="e.g. Dran Sword · 3-60 · GF"/></div>
    <div class="hint" id="f-hint"></div>
    ${imgPickerHTML("Image")}
    <div class="row2">
      <div class="field"><label>System</label><select id="f-system">${sel(p.system,["BX","UX","CX"])}</select></div>
      <div class="field"><label>Weight (g, optional)</label><input id="f-weight" type="number" step="0.1" value="${p.weightG!=null?p.weightG:""}"/></div>
    </div>
    <div class="field"><label>Source page (optional)</label>
      <input id="f-src" value="${esc(p.srcUrl||"")}" placeholder="e.g. https://kyoganken.sakura.ne.jp/beyx/parts0.htm#…"/></div>
    <div class="hint">Paste the part's page on kyoganken and the Source link will point there instead of a web search.</div>
    <div id="f-extra"></div>
    <div class="sheet-actions">
      <button class="btn ghost" data-action="close-modal">Cancel</button>
      <button class="btn primary" data-action="save-part" data-edit="${editing?p.id:""}">${editing?"Save":"Add part"}</button>
    </div>
  `);
  const kindSel=$("#f-kind");
  const drawExtra=()=>{
    const k=kindSel.value;
    const sel2=(cur,opts)=>opts.map(o=>`<option value="${o}" ${o===cur?"selected":""}>${o}</option>`).join("");
    if(k==="blade"){
      $("#f-hint").textContent="Blade = the main body. Set its battle type and spin direction.";
      $("#f-extra").innerHTML=`<div class="row2">
        <div class="field"><label>Type</label><select id="f-btype">${sel2(p.bladeType||"Attack",["Attack","Defense","Stamina","Balance"])}</select></div>
        <div class="field"><label>Spin</label><select id="f-spin">${sel2(p.spin||"Right",["Right","Left"])}</select></div>
      </div>
      <div class="field"><label>Debut product (optional)</label><input id="f-debut" value="${esc(p.debut||"")}" placeholder="e.g. BX-01"/></div>
      <div class="field"><label>Notes (optional)</label><textarea id="f-note" rows="2">${esc(p.note||"")}</textarea></div>`;
    }else if(k==="ratchet"){
      $("#f-hint").textContent="Ratchet name encodes sides-height, e.g. 3-60 = 3 sides, 60 mm. Auto-filled from the name.";
      $("#f-extra").innerHTML=`<div class="row2">
        <div class="field"><label>Sides</label><input id="f-sides" type="number" value="${p.sides!=null?p.sides:""}"/></div>
        <div class="field"><label>Height (mm)</label><input id="f-height" type="number" value="${p.heightMm!=null?p.heightMm:""}"/></div>
      </div>`;
    }else if(k==="bit"){
      $("#f-hint").textContent="Bit = the tip. Give its abbreviation, full name, and how it moves.";
      $("#f-extra").innerHTML=`<div class="field"><label>Full name</label><input id="f-full" value="${esc(p.fullName||"")}" placeholder="e.g. Gear Flat"/></div>
      <div class="field"><label>Category</label><select id="f-btype">${sel2(p.bitType||"Attack",["Attack","Defense","Stamina","Balance"])}</select></div>
      <div class="field"><label>Movement (optional)</label><textarea id="f-move" rows="2">${esc(p.movement||"")}</textarea></div>`;
    }else{
      $("#f-hint").textContent="Custom Line part. A finished CX combo is Lock Chip + Main Blade + Assist Blade.";
      $("#f-extra").innerHTML=`<div class="field"><label>Debut product (optional)</label><input id="f-debut" value="${esc(p.debut||"")}" placeholder="e.g. CX-01"/></div>`;
    }
  };
  drawExtra();
  initPicker(p.img);
  kindSel.addEventListener("change",drawExtra);
  // auto-parse ratchet name -> sides/height
  $("#f-name").addEventListener("input",()=>{
    if(kindSel.value!=="ratchet") return;
    const m=$("#f-name").value.trim().match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ const s=$("#f-sides"),h=$("#f-height"); if(s&&!s.value)s.value=m[1]; if(h&&!h.value)h.value=m[2]; }
  });
}

function saveePart(editId){
  const kind=$("#f-kind").value;
  const name=$("#f-name").value.trim();
  if(!name){ toast("Name is required"); return; }
  const system=$("#f-system").value;
  const wv=$("#f-weight").value;
  const srcUrl = ($("#f-src") ? $("#f-src").value.trim() : "") || null;
  const base={ system, weightG: wv===""?null:parseFloat(wv), img: commitImg(), srcUrl };
  let data;
  if(kind==="blade"){
    data={...base,kind,name,bladeType:$("#f-btype").value,spin:$("#f-spin").value,debut:$("#f-debut").value.trim(),note:$("#f-note").value.trim()};
  }else if(kind==="ratchet"){
    data={...base,kind,name,sides:parseInt($("#f-sides").value||"0",10),heightMm:parseInt($("#f-height").value||"0",10)};
  }else if(kind==="bit"){
    data={...base,kind,name,fullName:$("#f-full").value.trim(),bitType:$("#f-btype").value,movement:$("#f-move").value.trim()};
  }else{
    data={...base,kind,name,debut:($("#f-debut")?$("#f-debut").value.trim():"")};
  }
  if(editId){
    const p=partById(editId); Object.assign(p,data);
    toast("Part updated");
  }else{
    const prefix={blade:"b-",ratchet:"r-",bit:"bit-",lockchip:"lc-",mainblade:"mb-",assistblade:"ab-",metalblade:"mtb-",overblade:"ob-"}[kind]||"p-";
    let id=prefix+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    while(partById(id)) id+="-x";
    data.id=id; db.parts.push(data);
    toast("Part added");
  }
  save(); closeModal(); render();
  if(ui.selected) openDetail(ui.selected);
}

function variantForm(partId){
  const p=partById(partId); if(!p) return;
  const codes=Object.keys(db.productMeta).sort();
  openModal(`
    <h3>Add variant · ${esc(p.name)}</h3>
    <div class="field"><label>Color / finish</label><input id="v-color" placeholder="e.g. Blue, Metal Coat, Custom"/></div>
    ${imgPickerHTML("Photo of this colorway")}
    <div class="row2">
      <div class="field"><label>Product code</label>
        <input id="v-code" list="v-codes" placeholder="e.g. BX-14"/>
        <datalist id="v-codes">${codes.map(c=>`<option value="${esc(c)}">${esc(db.productMeta[c].name)}</option>`).join("")}</datalist>
      </div>
      <div class="field"><label>Rarity</label>
        <select id="v-rarity"><option>Standard</option><option>Rare</option><option>Special</option></select></div>
    </div>
    <div class="field"><label>Full combo it shipped as (optional)</label><input id="v-combo" placeholder="e.g. 3-60F"/></div>
    <div id="v-newprod" style="display:none">
      <div class="hint">New product code — add its details so it appears properly in Products:</div>
      <div class="field"><label>Product name</label><input id="v-pname" placeholder="e.g. Random Booster Vol.12"/></div>
      <div class="row2">
        <div class="field"><label>Product type</label><select id="v-ptype">
          <option>Starter</option><option>Booster</option><option>Random Booster</option>
          <option>Deck Set</option><option>Set</option><option>Tool</option>
          <option>Stadium</option><option>Special</option></select></div>
        <div class="field"><label>Release date</label><input id="v-pdate" placeholder="e.g. 2026-09-12"/></div>
      </div>
      <div class="field"><label>Price (yen, optional)</label><input id="v-pprice" type="number" placeholder="e.g. 1600"/></div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" data-action="close-modal">Cancel</button>
      <button class="btn primary" data-action="save-variant" data-id="${partId}">Add variant</button>
    </div>
  `);
  initPicker(null);
  const codeInput=$("#v-code");
  const check=()=>{ const c=codeInput.value.trim(); $("#v-newprod").style.display = (c && !db.productMeta[c]) ? "block" : "none"; };
  codeInput.addEventListener("input",check);
}

function saveeVariant(partId){
  const color=$("#v-color").value.trim()||"Variant";
  const code=$("#v-code").value.trim();
  if(!code){ toast("Product code is required"); return; }
  if(!db.productMeta[code]){
    const pr = $("#v-pprice") ? $("#v-pprice").value.trim() : "";
    db.productMeta[code]={
      name:  $("#v-pname").value.trim()||code,
      type:  $("#v-ptype").value,
      date:  $("#v-pdate").value.trim(),
      price: pr===""?null:parseInt(pr,10)
    };
  }
  const id="v"+Date.now();
  db.variants.push({id,partId,color,productCode:code,combo:$("#v-combo").value.trim(),rarity:$("#v-rarity").value,img:commitImg()});
  save(); closeModal(); toast("Variant added"); render(); openDetail(partId);
}

/* ============================================================
   Export / Import / Reset
   ============================================================ */
/* CSV of every row's photo source: name, code, and the matching link
   (kyoganken when known, a search otherwise). For anyone who wants to
   automate their OWN downloading with their own tooling -- that stays
   a choice this app hands off rather than one it makes for you. */
function exportLinksCSV(){
  const esc = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const rows = [["kind","id","name","code","link_type","source","url"]];
  db.parts.forEach(p=>{
    const f = findPartURL(p);
    rows.push(["part", p.id, p.name, p.debut||"", f.kind, f.direct?hostLabel(f.url):"search", f.url]);
  });
  db.variants.forEach(v=>{
    const p = partById(v.partId); if(!p) return;
    const f = findVariantURL(p, v);
    rows.push(["variant", v.id, p.name+" · "+v.color, v.productCode, f.kind, f.direct?hostLabel(f.url):"search", f.url]);
  });
  const csv = rows.map(r=>r.map(esc).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "beyblade-x-photo-links.csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported "+(rows.length-1)+" links");
}

function exportJSON(){
  gcImages();
  const blob=new Blob([JSON.stringify({...db, images:imgs},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="beyblade-x-parts.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported JSON");
}
/* Import either replaces everything, or merges a patch into what you
   already have. Merge is the one you want for a new release: a small
   file listing just the new parts, variants and product codes. */
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{ data = JSON.parse(r.result); }
    catch(e){ toast("Couldn't read that file"); return; }
    if(!data.parts && !data.variants && !data.productMeta){
      toast("Not a valid parts file"); return;
    }
    const counts = (data.parts||[]).length + " parts, " + (data.variants||[]).length + " variants";
    const merge = confirm(
      "Import " + counts + ".\n\n" +
      "OK = MERGE into your current data (keeps everything you have — use this for a new release).\n" +
      "Cancel = REPLACE everything with this file."
    );
    if(merge) mergeImport(data); else replaceImport(data);
  };
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(file);
}

function replaceImport(data){
  imgs = data.images || {};
  const {images, ...rest} = data;
  db = Object.assign({parts:[],productMeta:{},variants:[]}, rest);
  db.seedVersion = SEED_VERSION;
  save(); closeDetail(); render();
  toast("Replaced with " + db.parts.length + " parts");
}

/* Adds anything new, updates fields on parts you already have, and
   never deletes. Safe to run the same patch twice. */
function mergeImport(data){
  let addedP=0, updatedP=0, addedV=0, addedProd=0;

  Object.assign(imgs, data.images || {});

  (data.parts||[]).forEach(np=>{
    const cur = partById(np.id);
    if(!cur){ db.parts.push(np); addedP++; }
    else{
      // Fill in or correct fields from the patch, but never clobber
      // a photo you added with an empty one.
      Object.keys(np).forEach(k=>{
        if(k==="img" && !np.img) return;
        if(np[k]!==undefined && np[k]!==null && np[k]!==cur[k]) cur[k]=np[k];
      });
      updatedP++;
    }
  });

  const vkey = v => v.partId+"|"+v.productCode+"|"+(v.combo||"")+"|"+(v.color||"");
  const seen = new Set(db.variants.map(vkey));
  let n = db.variants.length;
  (data.variants||[]).forEach(nv=>{
    if(seen.has(vkey(nv))) return;
    db.variants.push({...nv, id:"i"+(++n)});
    seen.add(vkey(nv));
    addedV++;
  });

  Object.keys(data.productMeta||{}).forEach(code=>{
    if(!db.productMeta[code]){ db.productMeta[code]=data.productMeta[code]; addedProd++; }
  });

  save(); closeDetail(); render();
  toast(`Merged: +${addedP} parts, +${addedV} variants, +${addedProd} products`);
}

/* ============================================================
   Events
   ============================================================ */
/* Everything that writes. The read-only build removes the buttons outright,
   so this is belt-and-braces: it keeps behaviour coherent if one of these is
   reached some other way (a stale node, the console). */
const MUTATING = new Set(["add-part","edit-part","del-part","add-variant","del-variant",
                          "save-part","save-variant","import","reset","pick-img","clear-img"]);

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action, val=el.dataset.val, id=el.dataset.id;
  if(READ_ONLY && MUTATING.has(a)) return;
  switch(a){
    case "view": ui.view=val; render(); break;
    case "kind": ui.kind=val; render(); break;
    case "system": ui.system=val; render(); break;
    case "open": openDetail(id); break;
    case "close-detail": closeDetail(); break;
    case "add-part": partForm(null); break;
    case "edit-part": { const p=partById(id); partForm(p); break; }
    case "del-part":
      if(confirm("Delete this part and its variants?")){
        db.parts=db.parts.filter(p=>p.id!==id);
        db.variants=db.variants.filter(v=>v.partId!==id);
        save(); closeDetail(); render(); toast("Part deleted");
      } break;
    case "add-variant": variantForm(id); break;
    case "del-variant":
      db.variants=db.variants.filter(v=>v.id!==id);
      save(); if(ui.selected) openDetail(ui.selected); render(); toast("Variant removed"); break;
    case "save-part": saveePart(el.dataset.edit||null); break;
    case "save-variant": saveeVariant(id); break;
    case "close-modal": closeModal(); break;
    case "pick-img": $("#imgFile").click(); break;
    case "clear-img": { formImg=null; const u=$("#i-url"); if(u)u.value=""; refreshPreview(); break; }
    case "zoom":
      $("#lb-img").src = el.dataset.src;
      $("#lb-cap").textContent = el.dataset.cap || "";
      $("#lightbox").classList.add("show");
      break;
    case "close-lightbox": $("#lightbox").classList.remove("show"); break;
    case "export": exportJSON(); break;
    case "export-links": exportLinksCSV(); break;
    case "import": $("#importFile").click(); break;
    case "reset":
      if(confirm("Reset to the built-in starter dataset? Your parts, variants and images will be lost.")){
        db=seed(); db.seedVersion=SEED_VERSION; imgs={}; save(); closeDetail(); render(); toast("Reset to starter data");
      } break;
  }
});

/* Set .img on a part or variant, then refresh just that row's tile. */
function setRowImage(target, id, ref, tile){
  const obj = target === "part" ? partById(id) : db.variants.find(v=>v.id===id);
  if(!obj) return;
  obj.img = ref || null;
  save();
  const src = imgSrc(ref);
  if(tile) tile.innerHTML = src ? `<img src="${esc(src)}" alt=""/>` : "+";
}

$("#importFile")?.addEventListener("change",e=>{ if(READ_ONLY) return; if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
$("#imgFile")?.addEventListener("change",e=>{ if(READ_ONLY) return; if(e.target.files[0]) acceptImageFile(e.target.files[0]); e.target.value=""; });
$("#search").addEventListener("input",e=>{ ui.q=e.target.value; render(); });
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if($("#lightbox").classList.contains("show")) $("#lightbox").classList.remove("show");
  else if($("#modal").classList.contains("show")) closeModal();
  else closeDetail();
});

/* ============================================================
   Init
   ============================================================ */
(async function init(){
  /* Strip the editing chrome before the first paint. The buttons sit in a
     flex .toolbar, so they are removed by selector rather than wrapped —
     nesting a container would change the layout. */
  if(READ_ONLY){
    document.querySelectorAll(
      '[data-action="add-part"],[data-action="export"],[data-action="export-links"],' +
      '[data-action="import"],[data-action="reset"],#meter,#importFile,#imgFile'
    ).forEach(el=>el.remove());
  }

  await detectBackend();
  const [loaded, loadedImgs] = await Promise.all([ store.load(KEY), store.load(IMGKEY) ]);
  imgs = loadedImgs || {};

  const stale = !loaded || loaded.seedVersion !== SEED_VERSION;
  db = stale ? migrate(loaded) : loaded;
  if(stale) save();

  updateMeter();
  render();
  if(backend === "memory" && !READ_ONLY) toast("Storage unavailable — export before closing");
  else if(loaded && stale) toast("Parts data updated to "+db.parts.length+" parts");
})();
</script>
